# dsh-balance-panel bundle patch.
#
# 一行 loader 同时提供 Host / Client 两个半身：
#   - Host 半身：lib/host.js 在回环 webServer 上注册 /dsh-balance-panel 路由，
#     枚举全部已配置的模型 Provider、解析凭证（密钥不出进程）、查询余额接口。
#   - 浏览器半身：client-modules 通过 `dsh.client` + `exports["./client"]`
#     发现 lib/client.js（模型选择器左侧余额胶囊 + 悬浮余额面板）。
#
# loader id 与包名保持一致（dsh-balance-panel），避免与其他插件的行 id 冲突。
- insert:
    - id: dsh-balance-panel
      name: 'dsh-balance-panel'
